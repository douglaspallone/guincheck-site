name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22 LTS: os testes e o script legal:sync executam TypeScript direto no Node (type stripping, 22.18+).
          node-version: "22"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build with Next.js
        run: pnpm run build
        env:
          # Variáveis do repositório (Settings > Secrets and variables > Actions > Variables). Todas são PÚBLICAS
          # (vão para o navegador). Vazias = recurso desligado (a página de exclusão usa o caminho por e-mail).
          NEXT_PUBLIC_LEGAL_API_BASE_URL: ${{ vars.NEXT_PUBLIC_LEGAL_API_BASE_URL }}
          NEXT_PUBLIC_PRIVACY_API_BASE_URL: ${{ vars.NEXT_PUBLIC_PRIVACY_API_BASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4